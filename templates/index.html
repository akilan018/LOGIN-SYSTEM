<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Secure Login System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* ---------- Base & Background ---------- */
  html, body { 
    height: 100%; 
    margin: 0; 
    overflow-x: hidden;
  }
  
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    transition: background 0.4s ease, color 0.4s ease;
    min-height: 100vh;
  }

  /* Critical: Strict hidden class */
  .hidden { display: none !important; }

  /* ---------- Login Card Styling (From Image) ---------- */
  .form-container {
    background-color: #ffffff;
    border-radius: 1.5rem;
    padding: 3rem 2rem 2.5rem 2rem;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    position: relative;
    text-align: center;
    margin: 2rem auto;
  }

  /* Circular Profile Icon Overlapping Card Top */
  .profile-icon {
    width: 90px;
    height: 90px;
    background-color: #f3f4f6;
    border-radius: 50%;
    position: absolute;
    top: -45px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 5px solid #fff;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    color: #9ca3af;
    z-index: 20;
  }

  h2 {
    color: #111827;
    font-size: 1.85rem;
    font-weight: 700;
    margin-bottom: 2rem;
    letter-spacing: -0.025em;
  }

  /* ---------- Input Groups with Icons ---------- */
  .input-group {
    position: relative;
    margin-bottom: 1.25rem;
    text-align: left;
  }
  
  .input-group svg.field-icon {
    position: absolute;
    left: 1.15rem;
    top: 50%;
    transform: translateY(-50%);
    color: #9ca3af;
    width: 20px;
    height: 20px;
    pointer-events: none;
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    background-color: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 0.85rem;
    padding: 0.95rem 1rem 0.95rem 3.25rem;
    outline: none;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    font-size: 1rem;
    color: #111827;
  }

  input:focus {
    border-color: #3b82f6;
    background-color: #fff;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
  }

  .password-toggle {
    position: absolute;
    right: 1.15rem;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #9ca3af;
    background: none;
    border: none;
    padding: 0.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
  }
  .password-toggle:hover { color: #3b82f6; }

  /* ---------- Buttons ---------- */
  button.primary {
    width: 100%;
    background-color: #3b82f6;
    color: white;
    font-weight: 600;
    padding: 1rem;
    border-radius: 0.85rem;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
    font-size: 1.1rem;
    margin-top: 1rem;
    box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
  }
  button.primary:hover:not(:disabled) { 
    background-color: #2563eb; 
    box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
    transform: translateY(-1px);
  }
  button.primary:active:not(:disabled) { transform: translateY(0); }
  button.primary:disabled { background-color: #9ca3af; cursor: not-allowed; box-shadow: none; }

  .footer-links {
    margin-top: 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .footer-link { color: #6b7280; font-size: 0.9rem; transition: color 0.2s; cursor: pointer; text-decoration: none; }
  .footer-link span { color: #3b82f6; font-weight: 600; }
  .footer-link:hover span { text-decoration: underline; }

  /* ---------- Admin Dashboard Styling ---------- */
  .dashboard-card { max-width: 900px !important; text-align: left; padding-top: 2rem !important; }
  .table-container { 
    margin-top: 1.5rem; 
    border-radius: 0.75rem; 
    overflow: hidden; 
    border: 1px solid #e5e7eb;
  }
  table { width: 100%; border-collapse: collapse; }
  th { background-color: #f9fafb; font-weight: 600; color: #374151; padding: 1rem; text-align: left; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
  td { padding: 1rem; border-top: 1px solid #f3f4f6; vertical-align: middle; }

  .danger-button {
    background-color: #ef4444;
    color: white;
    padding: 0.4rem 0.75rem;
    border-radius: 0.5rem;
    font-size: 0.85rem;
    font-weight: 500;
    transition: background 0.2s;
  }
  .danger-button:hover { background-color: #dc2626; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: #1f2937;
    color: white;
    padding: 0.85rem 1.5rem;
    border-radius: 0.75rem;
    z-index: 100;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
    font-weight: 500;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ---------- Spinner ---------- */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 1.25rem;
    height: 1.25rem;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
  }

  /* ---------- Dark Mode Overrides ---------- */
  body.dark-mode { background: #0f172a; }
  .dark-mode .form-container { background: #1e293b; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6); }
  .dark-mode h2 { color: #f8fafc; }
  .dark-mode input { background: #334155; border-color: #475569; color: #f8fafc; }
  .dark-mode input:focus { border-color: #60a5fa; background-color: #1e293b; }
  .dark-mode .profile-icon { background: #334155; border-color: #1e293b; color: #94a3b8; }
  .dark-mode th { background: #334155; color: #cbd5e1; }
  .dark-mode td { border-color: #334155; color: #e2e8f0; }
  .dark-mode .toast { background: #f8fafc; color: #0f172a; }

  /* ---------- Modals ---------- */
  #modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index:90; display:none; }
  #modal-container {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#fff; z-index:100; padding:2rem; border-radius:1.25rem;
    width:90%; max-width:420px; display:none;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
  }
  .dark-mode #modal-container { background: #1e293b; color: #f8fafc; }

  /* ---------- Theme Toggle Top Center ---------- */
  .theme-toggle-container {
    position: fixed;
    top: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
  }
  #theme-toggle {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    padding: 0.5rem 1.25rem;
    border-radius: 2rem;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    transition: all 0.3s;
  }
  #theme-toggle:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.05); }

</style>
</head>
<body>

  <div class="theme-toggle-container">
    <button id="theme-toggle">TOGGLE THEME</button>
  </div>

  <div id="app-wrapper">

    <!-- LOGIN VIEW -->
    <div class="form-container" id="login-view">
      <div class="profile-icon">
        <svg class="w-14 h-14" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
      </div>
      <h2>Login</h2>
      
      <div class="input-group">
        <svg class="field-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <input type="text" id="username" placeholder="Username" autocomplete="username">
      </div>

      <div class="input-group">
        <svg class="field-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        <button type="button" class="password-toggle" data-target="password">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
        </button>
      </div>

      <button id="login-btn" class="primary">LOGIN</button>

      <div class="footer-links">
        <div id="show-register" class="footer-link">New User? <span>Register Here</span></div>
        <div id="show-forgot" class="footer-link"><span>Forget Password?</span></div>
      </div>
    </div>

    <!-- REGISTER VIEW -->
    <div class="form-container hidden" id="register-view">
      <div class="profile-icon">
        <svg class="w-14 h-14" fill="currentColor" viewBox="0 0 20 20"><path d="M8 9a3 3 0 100-6 3 3 0 000 6zM8 11a6 6 0 016 6H2a6 6 0 016-6zM16 7a1 1 0 10-2 0v1h-1a1 1 0 100 2h1v1a1 1 0 102 0v-1h1a1 1 0 100-2h-1V7z"></path></svg>
      </div>
      <h2>Create Account</h2>

      <div class="input-group">
        <svg class="field-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <input type="text" id="reg-username" placeholder="Choose Username" autocomplete="username">
      </div>

      <div class="input-group">
        <svg class="field-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        <input type="password" id="reg-password" placeholder="Create Password" autocomplete="new-password">
        <button type="button" class="password-toggle" data-target="reg-password">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
        </button>
      </div>

      <button id="register-btn" class="primary">REGISTER</button>

      <div class="footer-links">
        <div id="back-to-login" class="footer-link">Already have an account? <span>Login</span></div>
      </div>
    </div>

    <!-- FORGOT PASSWORD VIEW -->
    <div class="form-container hidden" id="forgot-view">
      <div class="profile-icon">
        <svg class="w-14 h-14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m-2-2v2m-2-2a2 2 0 00-2 2m2-2v2m0 0V9m0 2h2m-2 0v2m0-2H9m3 0V9"></path></svg>
      </div>
      <h2>Reset Password</h2>
      <div class="input-group">
        <input type="text" id="forgot-username" placeholder="Your Username" style="padding-left:1.25rem">
      </div>
      <div class="input-group">
        <input type="password" id="forgot-new" placeholder="New Password" style="padding-left:1.25rem">
      </div>
      <button id="reset-btn" class="primary">UPDATE PASSWORD</button>
      <div class="footer-links">
        <div id="back-login" class="footer-link">Return to <span>Login Screen</span></div>
      </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div class="form-container hidden dashboard-card" id="dashboard-view">
      <div class="flex justify-between items-center mb-4">
        <h2 class="!mb-0 !text-2xl">Admin Control</h2>
        <button id="admin-logout-btn" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-black transition">LOGOUT</button>
      </div>
      <div class="table-container" id="user-table-wrapper">
        <div id="user-table-content"></div>
      </div>
    </div>

    <!-- USER SUCCESS VIEW -->
    <div class="form-container hidden" id="user-view">
      <div class="profile-icon !bg-green-100 !text-green-600">
        <svg class="w-14 h-14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <h2>Login Successful!</h2>
      <p class="text-gray-500 dark:text-gray-400 text-sm mb-2">Authenticated as:</p>
      <h3 id="welcome-username" class="text-xl font-bold text-blue-600 mb-8">User</h3>
      <button id="user-logout-btn" class="primary !bg-gray-800 hover:!bg-black">LOGOUT</button>
    </div>

  </div>

  <div class="toast" id="toast-msg"></div>

  <!-- Shared Modal System -->
  <div id="modal-backdrop"></div>
  <div id="modal-container">
    <h3 id="modal-title" class="text-xl font-bold mb-3">Confirmation</h3>
    <p id="modal-message" class="text-gray-600 dark:text-gray-400 mb-6"></p>
    <div id="modal-input-group" class="hidden mb-6">
      <label id="modal-input-label" class="text-xs font-bold uppercase text-gray-400 mb-1 block">Value Required:</label>
      <input type="text" id="modal-input" class="w-full p-3 border rounded-xl dark:bg-slate-800 dark:border-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="flex justify-end gap-3">
      <button id="modal-cancel-btn" class="px-5 py-2.5 bg-gray-100 rounded-xl font-semibold dark:bg-slate-700 transition hover:bg-gray-200">Cancel</button>
      <button id="modal-confirm-btn" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl font-semibold transition hover:bg-blue-700">Confirm</button>
    </div>
  </div>

<script>
(function() {
  const API_URL = 'https://login-system-von4.onrender.com';
  const toastEl = document.getElementById('toast-msg');
  let toastTimer;

  // Modal references
  const modalBackdrop = document.getElementById('modal-backdrop');
  const modalContainer = document.getElementById('modal-container');
  const modalInput = document.getElementById('modal-input');
  let currentModalAction = null;

  // Common UI Functions
  function showToast(msg) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  function showView(viewId) {
    const views = ['login-view','register-view','forgot-view','dashboard-view','user-view'];
    views.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
    const target = document.getElementById(viewId);
    if (target) target.classList.remove('hidden');
  }

  function setLoading(btn, isLoading) {
    if (!btn) return;
    if (isLoading) {
      btn.dataset.originalContent = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span>';
      btn.disabled = true;
    } else {
      btn.innerHTML = btn.dataset.originalContent || 'SUBMIT';
      btn.disabled = false;
    }
  }

  // Navigation Event Listeners
  document.getElementById('show-register').onclick = () => showView('register-view');
  document.getElementById('back-to-login').onclick = () => showView('login-view');
  document.getElementById('show-forgot').onclick = () => showView('forgot-view');
  document.getElementById('back-login').onclick = () => showView('login-view');

  // --- CORE AUTH LOGIC ---

  // LOGIN FUNCTION (Corrected logic)
  const loginBtn = document.getElementById('login-btn');
  loginBtn.onclick = async () => {
    const userField = document.getElementById('username');
    const passField = document.getElementById('password');
    
    const username = userField.value.trim();
    const password = passField.value.trim();

    if (!username || !password) return showToast('Username and password are required.');

    setLoading(loginBtn, true);
    try {
      const res = await fetch(`${API_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      
      if (res.ok) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('session_id', data.session_id);
        
        if (data.role === 'admin') {
          loadDashboard();
        } else {
          document.getElementById('welcome-username').textContent = username;
          showView('user-view');
        }
      } else {
        showToast(data.error || 'Login failed.');
      }
    } catch (err) {
      showToast('Error connecting to the authentication server.');
    } finally {
      setLoading(loginBtn, false);
    }
  };

  // REGISTER FUNCTION
  const registerBtn = document.getElementById('register-btn');
  registerBtn.onclick = async () => {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value.trim();
    
    if (!username || !password) return showToast('Please enter required details.');
    
    setLoading(registerBtn, true);
    try {
      const res = await fetch(`${API_URL}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      
      if (res.ok) {
        showToast('Registration successful! Please login.');
        showView('login-view');
      } else {
        showToast(data.error || 'Registration failed.');
      }
    } catch (e) { showToast('Connection error.'); }
    finally { setLoading(registerBtn, false); }
  };

  // FORGOT PASSWORD
  const resetBtn = document.getElementById('reset-btn');
  resetBtn.onclick = async () => {
    const username = document.getElementById('forgot-username').value.trim();
    const new_password = document.getElementById('forgot-new').value.trim();
    
    if (!username || !new_password) return showToast('Fill all fields.');
    
    setLoading(resetBtn, true);
    try {
      const res = await fetch(`${API_URL}/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, new_password })
      });
      
      if (res.ok) {
        showToast('Password updated successfully.');
        showView('login-view');
      } else {
        showToast('Reset failed. Check username.');
      }
    } catch (e) { showToast('Server connection failed.'); }
    finally { setLoading(resetBtn, false); }
  };

  // --- ADMIN DASHBOARD LOGIC ---

  async function loadDashboard() {
    const token = localStorage.getItem('token');
    if (!token) return showView('login-view');

    try {
      const res = await fetch(`${API_URL}/admin/users`, {
        headers: { 'x-access-token': token }
      });
      
      if (res.ok) {
        const users = await res.json();
        renderUsers(users);
        showView('dashboard-view');
      } else {
        showToast('Session expired.');
        showView('login-view');
      }
    } catch (err) {
      showToast('Error loading user data.');
      showView('login-view');
    }
  }

  function renderUsers(users) {
    const container = document.getElementById('user-table-content');
    if (!users || users.length === 0) {
      container.innerHTML = '<div class="p-8 text-center text-gray-400">No registered users found.</div>';
      return;
    }

    const rows = users.map(user => {
      const sessions = (user.sessions || []).map(s => `
        <div class="flex justify-between items-center text-[0.7rem] bg-gray-50 dark:bg-slate-800 p-1.5 rounded mb-1 border dark:border-slate-700">
          <span class="truncate mr-2">Login: ${s.login_time}</span>
          <button class="text-red-500 font-bold px-1" onclick="deleteSession('${s._id}')">✕</button>
        </div>
      `).join('') || '<span class="text-gray-400 italic text-xs">No active sessions</span>';

      return `
        <tr>
          <td class="font-bold text-blue-600 dark:text-blue-400">${user.username}</td>
          <td><div class="max-h-[120px] overflow-y-auto pr-1">${sessions}</div></td>
          <td>
            <div class="flex flex-col gap-2">
              <button class="danger-button" onclick="deleteUser('${user._id}')">DELETE USER</button>
              <button class="bg-amber-100 text-amber-700 px-3 py-1.5 rounded-lg text-[0.7rem] font-bold hover:bg-amber-200" onclick="adminReset('${user._id}')">RESET PASS</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');

    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Sessions</th>
            <th>Management</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
        </tbody>
      </table>
    `;
  }

  // Admin Actions with Modals
  window.deleteUser = (id) => openModal('Delete User', 'Confirm permanent removal of this user and all their sessions?', 'Confirm Delete', 'bg-red-600', async () => {
    const token = localStorage.getItem('token');
    await fetch(`${API_URL}/admin/user/${id}`, { 
      method: 'DELETE', 
      headers: { 'x-access-token': token } 
    });
    loadDashboard();
  });

  window.deleteSession = (id) => openModal('Remove Session', 'Delete this specific session entry?', 'Remove', 'bg-red-600', async () => {
    const token = localStorage.getItem('token');
    await fetch(`${API_URL}/admin/session/${id}`, { 
      method: 'DELETE', 
      headers: { 'x-access-token': token } 
    });
    loadDashboard();
  });

  window.adminReset = (id) => openModal('Admin Overwrite', 'Enter the new password for this user account:', 'Update', 'bg-blue-600', async (val) => {
    const token = localStorage.getItem('token');
    const res = await fetch(`${API_URL}/admin/user/${id}/reset-password`, {
      method: 'POST',
      headers: { 'x-access-token': token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ new_password: val })
    });
    if (res.ok) showToast('User password successfully updated.');
    else showToast('Failed to update password.');
  }, true);

  // --- MODAL SYSTEM HELPERS ---

  function openModal(title, msg, confirmText, btnClass, onConfirm, hasInput = false) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-message').textContent = msg;
    const confirmBtn = document.getElementById('modal-confirm-btn');
    confirmBtn.textContent = confirmText;
    confirmBtn.className = `px-6 py-2.5 text-white rounded-xl font-bold transition ${btnClass}`;
    
    const inputGrp = document.getElementById('modal-input-group');
    if (hasInput) {
      inputGrp.classList.remove('hidden');
      modalInput.focus();
    } else {
      inputGrp.classList.add('hidden');
    }

    modalBackdrop.style.display = 'block';
    modalContainer.style.display = 'block';
    currentModalAction = () => onConfirm(modalInput.value.trim());
  }

  document.getElementById('modal-cancel-btn').onclick = () => {
    modalBackdrop.style.display = 'none';
    modalContainer.style.display = 'none';
    modalInput.value = '';
    currentModalAction = null;
  };

  document.getElementById('modal-confirm-btn').onclick = () => {
    if (currentModalAction) currentModalAction();
    document.getElementById('modal-cancel-btn').onclick();
  };

  // --- LOGOUT LOGIC ---

  async function performLogout() {
    const sid = localStorage.getItem('session_id');
    if (sid) {
      try {
        await fetch(`${API_URL}/logout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sid })
        });
      } catch (e) { /* silent fail on logout */ }
    }
    localStorage.clear();
    showView('login-view');
    showToast('You have been logged out.');
  }

  document.getElementById('admin-logout-btn').onclick = performLogout;
  document.getElementById('user-logout-btn').onclick = performLogout;

  // --- THEME & PASSWORD UTILS ---

  document.getElementById('theme-toggle').onclick = () => {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  };
  
  // Persistent Theme Load
  if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

  // Password Visibility Toggle Logic
  document.querySelectorAll('.password-toggle').forEach(btn => {
    btn.onclick = (e) => {
      const input = document.getElementById(btn.dataset.target);
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      
      // Toggle Icon
      btn.innerHTML = isPass 
        ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 1.274-4.057 5.064 7 9.542-7 1.866 0 3.634.605 5.006 1.625m2.38 2.38a10.05 10.05 0 01.625 3m-3.435 3.435A10.05 10.05 0 0112 19c-1.866 0-3.634-.605-5.006-1.625m9.37-9.37L5.625 5.625m12.75 12.75L5.625 5.625"></path></svg>'
        : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>';
    };
  });

})();
</script>
</body>
</html>
