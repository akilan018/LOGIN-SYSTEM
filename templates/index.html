<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Secure Login System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* ---------- Base ---------- */
  html, body { height: 100%; }
  body {
    font-family: 'Poppins', sans-serif;
    transition: background-color 0.3s ease, color 0.3s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1rem;
    background-color: #f3f4f6;
    color:#000;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* Critical Fix: Ensure hidden class actually hides elements */
  .hidden { display: none !important; }

  .form-container {
    background-color: #fff;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
    border-radius: 1rem;
    padding: 2.25rem;
    max-width: 560px;
    width: 100%;
    margin: auto;
  }

  label { display:block; font-weight:600; color:#374151; margin-bottom:0.5rem; font-size:0.95rem; }

  .password-wrapper { position:relative; width:100%; margin-bottom:1.5rem; }
  input[type="text"], input[type="password"] {
    background-color:#f9fafb;
    border:1px solid #d1d5db;
    color:#111827;
    border-radius:0.75rem;
    width:100%;
    padding:0.75rem 3rem 0.75rem 1rem;
    outline:none;
    transition:all 0.2s ease;
    margin-bottom:1.5rem;
    font-size:1rem;
    box-sizing:border-box;
  }

  .password-toggle {
    position:absolute;
    right:0.75rem;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#6b7280;
  }

  button.primary {
    width:100%;
    color:white;
    background-color:#4f46e5;
    font-weight:600;
    border-radius:0.75rem;
    padding:0.875rem;
    cursor:pointer;
    border:none;
    transition:all 0.18s ease;
  }
  button.primary:hover:not(:disabled) { background-color:#4338ca; }

  .footer-link { color:#4f46e5; font-weight:500; text-decoration: none; }
  .footer-link:hover { text-decoration: underline; }

  /* Dark Mode Styles */
  body.dark-mode { background-color:#0b1220; color:#fff; }
  .dark-mode .form-container { background-color:#111827; }
  .dark-mode label { color:#d1d5db; }
  .dark-mode input { background-color:#1f2937; border-color:#374151; color:#fff; }

  .spinner {
    display:inline-block;
    width:1rem;
    height:1rem;
    border:2px solid rgba(255,255,255,0.3);
    border-radius:50%;
    border-top-color:#fff;
    animation:spin 0.6s linear infinite;
    margin-right:0.5rem;
    vertical-align:middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="app-wrapper" class="w-full flex justify-center">
  <div class="form-container" id="login-view">
    <h2 class="text-3xl font-bold mb-6 text-center">Login</h2>
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter your username">
    <label for="password">Password</label>
    <div class="password-wrapper">
      <input type="password" id="password" placeholder="••••••••••">
      <button type="button" class="password-toggle" data-target="password">👁️</button>
    </div>
    <button id="login-btn" class="primary">Login</button>
    <div class="flex justify-between mt-4 text-sm">
      <a href="#" id="show-register" class="footer-link">Register</a>
      <a href="#" id="show-forgot" class="footer-link">Forgot password?</a>
    </div>
  </div>

  <div class="form-container hidden" id="register-view">
    <h2 class="text-3xl font-bold mb-6 text-center">Create Account</h2>
    <label for="reg-username">Username</label>
    <input type="text" id="reg-username" placeholder="Choose a username">
    <label for="reg-password">Password</label>
    <div class="password-wrapper">
      <input type="password" id="reg-password" placeholder="Create password">
      <button type="button" class="password-toggle" data-target="reg-password">👁️</button>
    </div>
    <button id="register-btn" class="primary">Register</button>
    <div class="text-center mt-4 text-sm">
      <a href="#" id="back-to-login" class="footer-link">Back to Login</a>
    </div>
  </div>

  <div class="form-container hidden" id="forgot-view">
    <h2 class="text-3xl font-bold mb-6 text-center">Reset Password</h2>
    <label for="forgot-username">Username</label>
    <input type="text" id="forgot-username" placeholder="Your username">
    <label for="forgot-new">New Password</label>
    <div class="password-wrapper">
      <input type="password" id="forgot-new" placeholder="New password">
      <button type="button" class="password-toggle" data-target="forgot-new">👁️</button>
    </div>
    <button id="reset-btn" class="primary">Reset Password</button>
    <div class="text-center mt-4 text-sm">
      <a href="#" id="back-login" class="footer-link">Back to Login</a>
    </div>
  </div>

  <div class="form-container hidden" id="user-view">
    <h2 class="text-2xl font-bold mb-4 text-center">Login Successful!</h2>
    <h3 id="welcome-username" class="text-xl text-center mb-6">Welcome!</h3>
    <button id="user-logout-btn" class="primary bg-red-600 hover:bg-red-700">Logout</button>
  </div>
</div>

<script>
(function() {
  const API_URL = 'https://login-system-von4.onrender.com';

  // Navigation Logic
  function showView(viewId) {
    const views = ['login-view','register-view','forgot-view','user-view'];
    views.forEach(id => document.getElementById(id).classList.add('hidden'));
    document.getElementById(viewId).classList.remove('hidden');
  }

  // Event Listeners
  document.getElementById('show-register').onclick = (e) => { e.preventDefault(); showView('register-view'); };
  document.getElementById('show-forgot').onclick = (e) => { e.preventDefault(); showView('forgot-view'); };
  document.getElementById('back-to-login').onclick = (e) => { e.preventDefault(); showView('login-view'); };
  document.getElementById('back-login').onclick = (e) => { e.preventDefault(); showView('login-view'); };

  // Login Logic
  document.getElementById('login-btn').onclick = async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const btn = document.getElementById('login-btn');

    if (!username || !password) return alert('Fill all fields');

    btn.innerHTML = '<span class="spinner"></span> Logging in...';
    btn.disabled = true;

    try {
      const res = await fetch(`${API_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('welcome-username').textContent = `Welcome, ${username}!`;
        showView('user-view');
      } else {
        alert(data.error || 'Login failed');
      }
    } catch (err) { alert('Server error'); }
    finally {
      btn.innerHTML = 'Login';
      btn.disabled = false;
    }
  };

  // Password Visibility Toggle
  document.querySelectorAll('.password-toggle').forEach(btn => {
    btn.onclick = () => {
      const input = document.getElementById(btn.dataset.target);
      input.type = input.type === 'password' ? 'text' : 'password';
    };
  });

  // Logout
  document.getElementById('user-logout-btn').onclick = () => showView('login-view');
})();
</script>
</body>
</html>
