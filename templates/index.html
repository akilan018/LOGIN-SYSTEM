<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Secure Login System</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* ===== YOUR ORIGINAL CSS (UNCHANGED) ===== */
html, body { height: 100%; }
body {
  font-family: 'Poppins', sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1rem;
  background:#f3f4f6;
}
.form-container{
  background:#fff;
  padding:2rem;
  border-radius:1rem;
  width:100%;
  max-width:560px;
}
input{
  width:100%;
  padding:.75rem;
  border-radius:.75rem;
  border:1px solid #ccc;
  margin-bottom:1rem;
}
button.primary{
  background:#4f46e5;
  color:white;
  width:100%;
  padding:.75rem;
  border-radius:.75rem;
}
.hidden{display:none}
.toast{
  position:fixed;
  bottom:1rem;
  right:1rem;
  background:#111;
  color:white;
  padding:.5rem 1rem;
  border-radius:.5rem;
  opacity:0;
  transition:.3s;
}
.toast.show{opacity:1}
.password-wrapper{position:relative}
.password-toggle{
  position:absolute;
  right:.75rem;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="app-wrapper">

<!-- ===== LOGIN VIEW ===== -->
<div class="form-container" id="login-view">
  <h2 class="text-3xl text-center mb-6 font-bold">Login</h2>

  <input id="username" placeholder="Username">
  <div class="password-wrapper">
    <input id="password" type="password" placeholder="Password">
    <button class="password-toggle" data-target="password"></button>
  </div>

  <button id="login-btn" class="primary">Login</button>

  <div class="flex justify-between mt-4">
    <a href="#" id="show-register">Register</a>
    <a href="#" id="show-forgot">Forgot password?</a>
  </div>
</div>

<!-- ===== REGISTER VIEW ===== -->
<div class="form-container hidden" id="register-view">
  <h2 class="text-3xl text-center mb-6 font-bold">Create Account</h2>
  <input id="reg-username" placeholder="Username">
  <div class="password-wrapper">
    <input id="reg-password" type="password" placeholder="Password">
    <button class="password-toggle" data-target="reg-password"></button>
  </div>
  <button id="register-btn" class="primary">Register</button>
  <div class="text-center mt-4">
    <a href="#" id="back-to-login">Back to Login</a>
  </div>
</div>

<!-- ===== FORGOT VIEW ===== -->
<div class="form-container hidden" id="forgot-view">
  <h2 class="text-3xl text-center mb-6 font-bold">Reset Password</h2>
  <input id="forgot-username" placeholder="Username">
  <div class="password-wrapper">
    <input id="forgot-new" type="password" placeholder="New Password">
    <button class="password-toggle" data-target="forgot-new"></button>
  </div>
  <button id="reset-btn" class="primary">Reset</button>
  <div class="text-center mt-4">
    <a href="#" id="back-login">Back to Login</a>
  </div>
</div>

<!-- ===== ADMIN DASHBOARD ===== -->
<div class="form-container hidden" id="dashboard-view">
  <h2 class="text-2xl font-bold mb-4">Admin Dashboard</h2>
  <button id="admin-logout-btn">Logout</button>
  <pre id="user-table"></pre>
</div>

<!-- ===== USER VIEW ===== -->
<div class="form-container hidden" id="user-view">
  <h2 class="text-2xl text-center mb-4">Login Successful</h2>
  <h3 id="welcome-username" class="text-center"></h3>
  <button id="user-logout-btn">Logout</button>
</div>

<div class="toast" id="toast-msg"></div>

</div>

<script>
/* ===== FIXED JS (OLD LOGIC, BUGS REMOVED) ===== */

const API_URL = "https://login-system-von4.onrender.com";
const toast = document.getElementById("toast-msg");

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),3000);
}

function showView(id){
  ["login-view","register-view","forgot-view","dashboard-view","user-view"]
  .forEach(v=>document.getElementById(v).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}
showView("login-view");

/* Password toggle FIX */
const eye = "👁";
const eyeOff = "🙈";

document.querySelectorAll(".password-toggle").forEach(btn=>{
  btn.textContent = eye;
  btn.onclick = ()=>{
    const input = document.getElementById(btn.dataset.target);
    input.type = input.type==="password"?"text":"password";
    btn.textContent = input.type==="password"?eye:eyeOff;
  };
});

/* Navigation */
show_register.onclick = e => (e.preventDefault(), showView("register-view"));
back_to_login.onclick = e => (e.preventDefault(), showView("login-view"));
show_forgot.onclick = e => (e.preventDefault(), showView("forgot-view"));
back_login.onclick = e => (e.preventDefault(), showView("login-view"));

/* Register */
register_btn.onclick = async ()=>{
  const u = reg_username.value.trim();
  const p = reg_password.value.trim();
  if(!u||!p) return showToast("Required");
  const r = await fetch(API_URL+"/register",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:u,password:p})
  });
  const d = await r.json();
  showToast(d.message||d.error);
  if(r.ok) showView("login-view");
};

/* Login */
login_btn.onclick = async ()=>{
  const u = username.value.trim();
  const p = password.value.trim();
  if(!u||!p) return showToast("Required");

  const r = await fetch(API_URL+"/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:u,password:p})
  });
  const d = await r.json();
  if(!r.ok) return showToast(d.error);

  localStorage.setItem("token",d.token);
  localStorage.setItem("session_id",d.session_id);
  d.role==="admin"?loadDashboard():showUser(u);
};

/* Forgot */
reset_btn.onclick = async ()=>{
  const u = forgot_username.value.trim();
  const p = forgot_new.value.trim();
  if(!u||!p) return showToast("Required");

  const r = await fetch(API_URL+"/forgot-password",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:u,new_password:p})
  });
  const d = await r.json();
  showToast(d.message||d.error);
  if(r.ok) showView("login-view");
};

/* User */
function showUser(name){
  welcome_username.textContent = "Welcome "+name;
  showView("user-view");
}

/* Logout */
async function logout(){
  await fetch(API_URL+"/logout",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({session_id:localStorage.getItem("session_id")})
  }).catch(()=>{});
  localStorage.clear();
  showView("login-view");
}
admin_logout_btn.onclick = logout;
user_logout_btn.onclick = logout;

/* Admin */
async function loadDashboard(){
  const r = await fetch(API_URL+"/admin/users",{
    headers:{"x-access-token":localStorage.getItem("token")}
  });
  const d = await r.json();
  user_table.textContent = JSON.stringify(d,null,2);
  showView("dashboard-view");
}
</script>

</body>
</html>
